image: texlive/texlive:latest-full@sha256:16c556aeb4095b47245fcd05db47061529e5df8fc8c04d97fb0f049055244526

variables:
  FILE_NAME: "root"

stages:
  - build

pdflatex:
  stage: build
  script:
    - latexmk -synctex=0 -interaction=nonstopmode --shell-escape -pdf -file-line-error $FILE_NAME.tex
  artifacts:
    paths:
      - $FILE_NAME.pdf
    expire_in: 4 weeks
