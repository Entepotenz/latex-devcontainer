image: texlive/texlive:latest-full@sha256:b20c42c2a5b1be892c26e6d3b896e9aa20350528ddd0d4444d23e5925ea1545d

variables:
  FILE_NAME: "root"

stages:
  - build

pdflatex:
  stage: build
  script:
    - latexmk -synctex=0 -interaction=nonstopmode --shell-escape -pdf -file-line-error $FILE_NAME.tex
  artifacts:
    paths:
      - $FILE_NAME.pdf
    expire_in: 4 weeks
