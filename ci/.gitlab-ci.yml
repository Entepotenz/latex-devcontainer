image: texlive/texlive:latest-full@sha256:a7ae4dfa9d521b5db14446872fa488b839021d1f604d0a3c74461784895f2a67

variables:
  FILE_NAME: "root"

stages:
  - build

pdflatex:
  stage: build
  script:
    - latexmk -synctex=0 -interaction=nonstopmode --shell-escape -pdf -file-line-error $FILE_NAME.tex
  artifacts:
    paths:
      - $FILE_NAME.pdf
    expire_in: 4 weeks
