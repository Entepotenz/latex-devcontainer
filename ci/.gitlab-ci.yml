image: texlive/texlive:latest-full@sha256:4984977ccf5afe883cb382d0163f267de0d029d140bb7a9e8f4c19f0b781d57b

variables:
  FILE_NAME: "root"

stages:
  - build

pdflatex:
  stage: build
  script:
    - latexmk -synctex=0 -interaction=nonstopmode --shell-escape -pdf -file-line-error $FILE_NAME.tex
  artifacts:
    paths:
      - $FILE_NAME.pdf
    expire_in: 4 weeks
